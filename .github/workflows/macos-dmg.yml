name: Build AI Sales OS macOS DMG

on:
  push:
    branches:
      - codex/macos-5.10.0-full
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version without v prefix; defaults to WAFlow.Mac.csproj'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  apple-silicon-dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          npm install --global pnpm@10.14.0
          python -m pip install --disable-pip-version-check Pillow

      - name: Resolve version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if (-not $version) {
            $version = ([xml](Get-Content -Raw -Encoding utf8 desktop/WAFlow.Mac/WAFlow.Mac.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid version: $version" }
          "MAC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce Windows v5.11.1 parity contract
        shell: pwsh
        run: ./scripts/test-macos-parity.ps1

      - name: Validate Apple signing configuration
        run: |
          if { test -n "$MACOS_CERTIFICATE_P12_BASE64" && test -z "$MACOS_CERTIFICATE_PASSWORD"; } ||
             { test -z "$MACOS_CERTIFICATE_P12_BASE64" && test -n "$MACOS_CERTIFICATE_PASSWORD"; }; then
            echo "Developer ID certificate secrets must be configured as a complete pair." >&2
            exit 1
          fi
          NOTARY_VALUES=0
          test -n "$APPLE_NOTARY_KEY_P8_BASE64" && NOTARY_VALUES=$((NOTARY_VALUES + 1))
          test -n "$APPLE_NOTARY_KEY_ID" && NOTARY_VALUES=$((NOTARY_VALUES + 1))
          test -n "$APPLE_NOTARY_ISSUER_ID" && NOTARY_VALUES=$((NOTARY_VALUES + 1))
          if test "$NOTARY_VALUES" -ne 0 && test "$NOTARY_VALUES" -ne 3; then
            echo "Apple notary secrets must be configured as a complete set." >&2
            exit 1
          fi
          if test "$NOTARY_VALUES" -eq 3 && test -z "$MACOS_CERTIFICATE_P12_BASE64"; then
            echo "Notarization requires the Developer ID certificate secrets." >&2
            exit 1
          fi

      - name: Import Developer ID certificate when configured
        if: ${{ env.MACOS_CERTIFICATE_P12_BASE64 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/ai-sales-os-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            sed -n 's/.*"\\(Developer ID Application:.*\\)"/\\1/p' | head -n 1)"
          test -n "$SIGNING_IDENTITY"
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build native Apple Silicon app, Bridge and DMG
        shell: pwsh
        run: |
          ./scripts/build-macos-preview.ps1 `
            -Version $env:MAC_VERSION `
            -Architecture AppleSilicon `
            -RepositoryUrl "https://github.com/${{ github.repository }}"

      - name: Notarize and staple Developer ID DMG when configured
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_NOTARY_KEY_P8_BASE64 != '' && env.APPLE_NOTARY_KEY_ID != '' && env.APPLE_NOTARY_ISSUER_ID != '' }}
        run: |
          NOTARY_KEY="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          DMG="dist/installers/AI Sales OS macOS Apple-Silicon Chinese v${MAC_VERSION}.dmg"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY"
          xcrun notarytool submit "$DMG" \
            --key "$NOTARY_KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Validate ZIP bundle
        run: |
          python scripts/test-macos-packages.py \
            --version "$MAC_VERSION" \
            --architectures arm64

      - name: Mount DMG and run native smoke test
        run: |
          python scripts/test-macos-dmg.py \
            --path "dist/installers/AI Sales OS macOS Apple-Silicon Chinese v${MAC_VERSION}.dmg" \
            --version "$MAC_VERSION" \
            --architecture arm64

      - name: Record checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/installers -File |
            Where-Object { $_.Name -match 'Apple-Silicon.*\.(dmg|zip)$' } |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              "$($hash.Hash)  $($_.Name)"
            } | Set-Content -LiteralPath dist/installers/SHA256SUMS-macOS.txt -Encoding utf8

      - name: Upload DMG and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: AI-Sales-OS-${{ env.MAC_VERSION }}-macOS-Apple-Silicon-DMG
          path: |
            dist/installers/AI Sales OS macOS Apple-Silicon Chinese v${{ env.MAC_VERSION }}.dmg
            dist/installers/AI Sales OS macOS Apple-Silicon Chinese Preview.zip
            dist/installers/SHA256SUMS-macOS.txt
          if-no-files-found: error
          retention-days: 30
